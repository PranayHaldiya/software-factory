name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Install actionlint
        run: .github/factory-setup.sh

      - name: Lint workflows
        run: actionlint -color

      - name: Station instructions are present
        run: |
          for f in stations/triage.md stations/implement.md; do
            test -s "$f" || { echo "::error file=$f::missing or empty"; exit 1; }
          done
