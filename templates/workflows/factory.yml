# Copy into .github/workflows/ of a repository that should use the factory.
# See https://github.com/PranayHaldiya/software-factory#use-it-in-another-repository
name: Factory

# Hand an issue to the factory by adding the `factory` label.
# The stations themselves live in factory-issue.yml.

on:
  issues:
    types: [labeled]

concurrency:
  group: factory-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  factory:
    # Only the repository owner can hand work to the factory: they must have written the
    # issue and applied the label. Issue text from anyone else never reaches a station.
    if: >-
      github.event.label.name == 'factory' &&
      github.event.sender.login == github.repository_owner &&
      github.event.issue.user.login == github.repository_owner
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    uses: PranayHaldiya/software-factory/.github/workflows/factory-issue.yml@main
    with:
      issue: ${{ github.event.issue.number }}
    secrets: inherit
